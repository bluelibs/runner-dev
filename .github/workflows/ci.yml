# .github/workflows/ci.yml

name: CI

# Least privilege by default; only the Pages deploy job asks for more.
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Lint, typecheck, build and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Mirrors package.json "engines" (>=22): @bluelibs/runner and
        # npm-skills both require Node 22+, so older lines are unsupported.
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # The second install pulls the Linux-native rollup/sass binaries that npm
      # can drop when the lockfile was generated on another platform.
      - name: Install dependencies
        run: |
          npm install
          npm install @rollup/rollup-linux-x64-gnu sass-embedded-linux-x64

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Builds, then runs Jest with --coverage so the coverageThreshold in
      # config/jest/jest.config.js actually gates the run.
      - name: Build and test with coverage thresholds
        run: npm run test:ci

      # Fails when dist requires a package consumers do not install, or loads
      # an optional peer (typescript) eagerly from the package entry.
      - name: Check runtime dependencies of the build
        run: npm run check:runtime-deps

      # Audit results do not depend on the Node version; run them once.
      - name: Audit backend, frontend tooling, and a fresh release scaffold
        if: matrix.node-version == 22
        run: |
          npm run audit
          npm run audit:scaffold

  deploy-docs:
    name: Deploy API docs to GitHub Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate documentation
        run: npm run typedoc

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
